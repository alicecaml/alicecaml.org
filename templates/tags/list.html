{% extends "base.html" %}

{% block title %}
<meta property="og:title" content="{{ "Alice: Tags" }}">
<title>{{ "Alice: Tags" }}</title>
{% endblock title %}

{% block content %}
<h1>Tags</h1>
{% for term in terms %}
<h2><a href="{{ term.permalink }}">{{ term.name }}</a></h2>
<ul>
{% for page in term.pages %}
<li>{{ <post_link  page/> }}</li>
{% endfor %}
</ul>
{% endfor %}
{% endblock content %}
