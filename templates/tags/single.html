{% extends "base.html" %}

{% block title %}
<meta property="og:title" content="{{ "Alice: " ~ term.name }}">
<title>{{ "Alice: " ~ term.name }}</title>
{% endblock title %}

{% block content %}
<h1>{{ term.name }}</h1>
<ul>
{% for page in term.pages %}
<li>{{ <post_link page/> }}</li>
{% endfor %}
</ul>
{% endblock content %}
